[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synaps-backend"
version = "1.0.0"
description = "SYNAPS Signal Intelligence API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1",
    "groq>=0.18.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "torch>=2.1.0",
]

# ---------------------------------------------------------------------------
# uv index configuration
# PyPI is the default index for all packages.
# torch is sourced from the CPU-only PyTorch wheel index so Vercel does not
# download the 4 GB CUDA build.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
