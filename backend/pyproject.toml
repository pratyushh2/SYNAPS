[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synaps-backend"
version = "1.0.0"
description = "SYNAPS Signal Intelligence FastAPI Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1",
    "groq>=0.18.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "matplotlib>=3.8.0",
    "torch>=2.1.0",
]

[tool.vercel]
entrypoint = "main:app"
